name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Native macOS runners historically could not link libSystem with older Zig on
  # GitHub's images (undefined _abort/_malloc/...), so tests run on Linux only;
  # macOS/Windows are covered by cross-compilation below and by the local (macOS)
  # autonomous sessions.
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Zig
        uses: mlugg/setup-zig@v2
      - name: Clear Zig cache
        run: rm -rf .zig-cache zig-out
      - name: Format check
        run: zig fmt --check src build.zig bench tools
      - name: Build
        run: zig build
      - name: Test
        run: zig build test
      - name: Bench (compile + smoke run)
        run: zig build bench -- __ci_no_match__
      - name: Simulator sweep (1000 seeds)
        run: zig build sim -Dseeds=1000
      - name: Simulator sweep catches a planted fault
        run: |
          if zig build sim -Dseeds=200 -Dplant=lose_synced_hard_state 2> planted.log; then
            echo "the planted fault passed the sweep"
            exit 1
          fi
          cat planted.log
          grep -q 'FAIL seed=' planted.log

  cross-compile:
    name: Cross-compile (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - x86_64-macos-none
          - aarch64-macos-none
          - x86_64-windows-msvc
          - aarch64-windows-msvc
    steps:
      - uses: actions/checkout@v5
      - name: Install Zig
        uses: mlugg/setup-zig@v2
      - name: Clear Zig cache
        run: rm -rf .zig-cache zig-out
      - name: Build
        run: zig build -Dtarget=${{ matrix.target }}
